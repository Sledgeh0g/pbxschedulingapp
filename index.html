      DIRECTION CONTRACT — Schedule / PBX Truck Service (replacement visual world)
      THESIS: A DECwriter hardcopy terminal — monospace ink on white paper, red
        ribbon for emphasis — replacing the default rounded admin theme. The
        board itself is the identity; chrome recedes behind the grid.
      OWN-WORLD: paper #ffffff, ink #171717, ribbon red #f40604 (chrome/identity
        only — never task data). One monospace face (VT323, OFL; DEC Terminal
        Modern when locally licensed). Zero radius, zero shadow, 1px hairlines,
        double rules, reverse video for active/primary. Priority greens/amber/red
        and department dots/icons are pinned data colors, unchanged.
      STORY: dispatch scans today's tickets, takes a call, assigns shop and
        urgency; nothing visual competes with the work order.
      FIRST VIEWPORT: flush shop bar (brand block, department select, search,
        view tabs — active tab in red reverse video), collapsible legend strip
        with live status line, then the calendar grid at full width.
      FORM: user-pinned direction (terminal world, white/red, no radius, mono
        everywhere) — brief-pinned, no concept roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
        the finish review, the verdict, DESIGN.md, and every shipping raster
        carrying its provenance.
    -->

    <script type="module" src="/src/main.jsx"></script>
